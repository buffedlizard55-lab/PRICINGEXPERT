name: Pages gate

# The repo's GitHub Pages source is set to "Deploy from a branch" (main, /) — the
# site deploys from the committed main branch. (Switching the source to "GitHub
# Actions" requires a Settings click or an admin API token the session integration
# does not hold; doing so makes this workflow's rebuild the published artifact.)
# This workflow is the integrity gate for whatever main is about to serve:
# unit tests, the V1-V13 verification gate, a deterministic rebuild re-check, and
# the remote probes (link reachability + official API liveness, non-blocking).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (python)
        run: |
          python3 tests/test_paper_engine.py
          python3 tests/test_forward_desk.py
          python3 tests/test_collect.py
          python3 tests/test_market_pick.py
          python3 tests/test_derive_candles.py
      - name: Unit tests (browser engine, node)
        run: node tests/engine.test.mjs
      - name: Verification gate (hashes, ledger, fees, books, links-local)
        run: python3 scripts/verify.py data

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Transparency probes: run with runner egress. Failures are a finding (logged
      # in the run), never a blocker — the site has a labelled snapshot fallback.
      - name: Remote link probe (all external URLs in site assets)
        continue-on-error: true
        run: python3 scripts/probe_links.py data || true
      - name: Endpoint probe (official API liveness)
        continue-on-error: true
        run: python3 scripts/probe_endpoints.py data || true
      - name: Rebuild published data (deterministic re-check)
        run: python3 scripts/build_site.py data
      - name: Re-verify after rebuild
        run: python3 scripts/verify.py data
