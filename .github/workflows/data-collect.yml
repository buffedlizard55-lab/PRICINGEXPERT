name: Data collect (plan-triggered)

# Fires ONLY when data/collect_plan.json changes: no loop risk (evidence commits
# never touch the plan file). The runner has full egress, so this is the permanent
# collection route for the session (IRR-01). Read-only official API only.
on:
  push:
    paths:
      - "data/collect_plan.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect evidence per plan (official public API, read-only)
        continue-on-error: true   # failures are diagnosed via data/collect-report.json
        run: python3 scripts/collect.py --plan data/collect_plan.json --out data
      - name: Regenerate manifest
        run: python3 scripts/make_manifest.py data
      - name: Derive (observations + candle archive)
        run: python3 scripts/derive.py data
      - name: Backtest on committed candle archive (if any)
        run: python3 scripts/backtest.py data || echo "backtest skipped (no candles yet)"
      - name: Rebuild site data
        run: python3 scripts/build_site.py data
      - name: Verification gate
        run: python3 scripts/verify.py data
      - name: Commit evidence + report
        run: |
          set -x   # trace every command: if a step fails, the log names the exact failing command
          git config user.name "pricingexpert-desk[bot]"
          git config user.email "desk@users.noreply.github.com"
          # Add everything under data/ that changed (raw, provenance, manifest, report,
          # candles, observations, backtest, research, site) - robust to any of the
          # derived dirs not existing when a collect step failed.
          git add -A data/
          if git diff --cached --quiet; then
            echo "no new evidence to commit"
          else
          git commit -m "evidence: collect_plan run $(date -u +%Y%m%dT%H%M%SZ)Z"
          git push || {
            echo "::error::push failed — token scope diagnostic:"
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY" | head -c 300; echo
            exit 1
          }
          fi
